<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>OpenTaiko browser host</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #game{display:block;width:100%;height:100%;touch-action:none}
    #files{display:none}
  </style>
</head>
<body>
  <canvas id="game" aria-label="OpenTaiko game canvas"></canvas>
  <input id="files" type="file" multiple>
  <script type="module">
    import { createOpenTaikoHost } from "./host.js";
    const host = createOpenTaikoHost(document.querySelector("#game"));
    window.openTaikoHost = host;
    console.info("[OpenTaiko browser host]", host.capabilities);
  </script>
</body>
</html>
